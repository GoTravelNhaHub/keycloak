# Local development: Keycloak 26.8.1 + its own Postgres.
#   cp .env.example .env && docker compose up -d
#   Admin console: http://localhost:8080/admin  (KC_BOOTSTRAP_ADMIN_* from .env)
#   Realm:         http://localhost:8080/realms/gotravelnha
#
# Postgres is published on 5433 so it does not clash with familyhub-postgres (5432).

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    ports:
      - "5433:5432"
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    restart: unless-stopped
    # start-dev: HTTP, no caching of themes, relaxed hostname checks.
    # --import-realm: imports realm/*.json on first boot only (skipped if the realm exists).
    command: ["start-dev", "--import-realm"]
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
    ports:
      - "8080:8080" # HTTP (realms, admin console)
      - "9000:9000" # management: /health, /metrics
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl; talk HTTP over bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  keycloak-pgdata:
