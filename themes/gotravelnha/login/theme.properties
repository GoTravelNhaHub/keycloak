parent=keycloak.v2
import=common/keycloak

# keycloak.v2's css/styles.css first (layout fixes for its widgets), then the brand layer.
styles=css/styles.css css/gotravelnha.css

# The web app is light-only; keep the auth pages the same.
darkMode=false

# Privacy / Terms links and the logo fallback when the client has no base URL (e.g. mobile apps).
gtnSiteUrl=https://www.gotravelnha.com

# Same order as the web app's sign-in page: Google button full width, label "Continue with Google".
kcFormSocialAccountListButtonClass=pf-v5-c-button pf-m-tertiary pf-m-block gtn-social-button
kcFormSocialAccountListClass=gtn-social-list
kcFormSocialAccountListItemClass=gtn-social-item

